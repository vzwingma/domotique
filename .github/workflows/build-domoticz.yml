# This is a basic workflow to help you get started with Actions

name: Build Domoticz ARM Docker Image

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master, feat/scripts ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Download Linky Script
  download-linky:
    name: Download Linky Script
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - 
        name: Checkout the code Linky
        uses: actions/checkout@v7
        with:
            repository: vzwingma/DomoticzLinky
            ref: f3df2584ab398110eefe8d65df1b83d9a9d95395 # v2.6.1
      - 
        name: Trace Linky provenance
        run: |
          echo "Linky : vzwingma/DomoticzLinky @ $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          grep -m1 -o 'version="[^"]*"' plugin.py >> "$GITHUB_STEP_SUMMARY"
      # Upload plugin Linky
      - uses: actions/upload-artifact@v7
        name: Upload Python script
        with:
            name: linky-plugin
            path: ${{ github.workspace }}/plugin.py
            if-no-files-found: error
  # Download DeCONZ Script
  download-deconz:
    name: Download DeCONZ Script
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - 
        name: Checkout the code DeCONZ
        uses: actions/checkout@v7
        with:
            repository: Smanar/Domoticz-deCONZ
            ref: 95b8f8baf6aacda21f2e3aec18d75ac705fd0b8a # 1.0.35
      - 
        name: Trace deCONZ provenance
        run: |
          echo "deCONZ : Smanar/Domoticz-deCONZ @ $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          grep -m1 -o 'version="[^"]*"' plugin.py >> "$GITHUB_STEP_SUMMARY"
      # Upload plugin deCONZ
      - uses: actions/upload-artifact@v7
        name: Upload Python scripts
        with:
            name: deconz-plugin
            path: ${{ github.workspace }}/*.py
            if-no-files-found: error
  # Push image to DockerHub
  build-push-domoticz:
    name: Build and Push ARM Docker Image
    runs-on: ubuntu-latest
    environment: PROD
    needs: 
      - download-linky
      - download-deconz
    env:      
      DOCKER_REGISTRY: registry.hub.docker.com
      DOCKER_IMAGE: vzwingmadomatic/domoticz
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}  
      DOCKER_TARGET_PLATFORM: linux/arm/v7

    permissions:
      contents: read
    steps:
      - 
        name: Checkout the code  
        uses: actions/checkout@v7
      - 
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      # https://github.com/docker/setup-buildx-action
      - 
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - 
        name: Log into registry
        run: echo "$DOCKER_PASSWORD" | docker login -u $DOCKER_USERNAME --password-stdin
      - 
        name: Get image metadata
        run: |
          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # Use Docker `latest` tag convention
          [ "$VERSION" == "master" ] && VERSION=latest

          echo "DOCKER_IMAGE_TAG=$DOCKER_IMAGE:$VERSION" >> $GITHUB_ENV
      - 
        uses: actions/download-artifact@v8
        name: Download Script Linky
        with:
          name: linky-plugin
          path: _docker/build_domoticz/linky
      - 
        uses: actions/download-artifact@v8
        name: Download Script deCONZ
        with:
          name: deconz-plugin
          path: _docker/build_domoticz/deconz          
      - name: Build and Push ARM Docker Image
        run: |
          cp domoticz/scripts/dzVents/*.lua _docker/build_domoticz
          cd _docker/build_domoticz
          docker buildx build --platform ${{ env.DOCKER_TARGET_PLATFORM }}  --file Dockerfile --tag ${{ env.DOCKER_IMAGE_TAG }} --output type=image,push=true .
