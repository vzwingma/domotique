# This is a basic workflow to help you get started with Actions

name: Build Tydom Bridge ARM Docker Image

# Controls when the action will run. 
on:
  # Validate the GitOps branch and existing development branches.
  # Push: image sources only, so that Compose/docs commits on master do not republish `latest`.
  push:
    branches: [ main, master, feat/tydom, feat/tydom_resilience ]
    paths:
      - 'tydom-bridge/**'
      - '_docker/build_tydom/**'
      - '!**/*.md'
  pull_request:
    branches: [ main, master, feat/tydom, feat/tydom_resilience ]
    paths:
      - 'tydom-bridge/**'
      - '_docker/build_tydom/**'
      - '.github/workflows/build-tydom.yml'
      - '!**/*.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier le candidat linux/arm64 (tag immuable candidate-node26-arm64-<SHA>)'
        type: boolean
        default: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Run unit tests
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout the code  
        uses: actions/checkout@v7
      - 
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: tydom-bridge/package-lock.json
      - 
        name: Install dependencies
        working-directory: tydom-bridge
        run: npm ci
      - 
        name: Run unit tests
        working-directory: tydom-bridge
        run: npm test

  # Scan to Sonar
  scan-sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [ test ]

    steps:
      - 
        name: Checkout the code  
        uses: actions/checkout@v7
      # Setup Node.js (for Sonar)
      - 
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26' 
      # Run the Sonar scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: tydom-bridge
          args: >
            -Dsonar.organization=vzwingma-github
            -Dsonar.projectKey=tydom_bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          sonar.projectKey: tydom_bridge
          sonar.organization: vzwingma-github

  # Build + smoke test du candidat (sans secrets, sans login, sans push)
  build-candidate-tydom:
    name: Build candidat Node 26 ARM64 (sans publication)
    runs-on: ubuntu-latest
    needs:
      - test
    env:
      DOCKER_TARGET_PLATFORM: linux/arm64
      LOCAL_IMAGE: tydom-candidate:local
    permissions:
      contents: read

    steps:
      -
        name: Checkout the code
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build ARM64 image (local, no push)
        run: |
          docker buildx build --platform "$DOCKER_TARGET_PLATFORM" \
            --file _docker/build_tydom/Dockerfile \
            --tag "$LOCAL_IMAGE" --load tydom-bridge
      -
        name: Smoke test (arch, Node, tydom-client) sans réseau
        run: |
          docker run --rm --network none --platform "$DOCKER_TARGET_PLATFORM" "$LOCAL_IMAGE" node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('/usr/app/node_modules/tydom-client/package.json', 'utf8')).version;
            require('tydom-client');
            const c = process.env.OPENSSL_CONF;
            console.log('arch=' + process.arch, 'node=' + process.version, 'tydom-client=' + v, 'openssl_conf=' + c);
            if (process.arch !== 'arm64') throw new Error('arch ' + process.arch);
            if (!process.version.startsWith('v26.')) throw new Error('node ' + process.version);
            if (v !== '0.16.1') throw new Error('tydom-client ' + v);
            if (!c || !fs.readFileSync(c, 'utf8').includes('UnsafeLegacyRenegotiation')) throw new Error('OPENSSL_CONF ' + c);
          "

  # Production on master pushes; candidate publication remains manual.
  publish-candidate-tydom:
    name: Build and push ARM64 image
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
    environment: PROD
    needs:
      - build-candidate-tydom
      - scan-sonar
    concurrency:
      group: tydom-publication-${{ github.event_name == 'push' && 'latest' || github.sha }}
      cancel-in-progress: false
    env:
      DOCKER_IMAGE: vzwingmadomatic/domoticz-tydom
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKER_TARGET_PLATFORM: linux/arm64
      DOCKER_IMAGE_TAG: ${{ github.event_name == 'push' && 'vzwingmadomatic/domoticz-tydom:latest' || format('vzwingmadomatic/domoticz-tydom:candidate-node26-arm64-{0}', github.sha) }}
    permissions:
      contents: read

    steps:
      -
        name: Checkout the code
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Log into registry
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      -
        name: Refuse to overwrite an existing candidate tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if docker buildx imagetools inspect "$DOCKER_IMAGE_TAG" >manifest.txt 2>manifest-error.txt; then
            echo "::error::Le tag $DOCKER_IMAGE_TAG existe déjà (immuable)"; exit 1
          fi
          if ! grep -Eq 'manifest unknown|not found' manifest-error.txt; then
            cat manifest-error.txt >&2
            echo "::error::Impossible de vérifier l'absence du candidat"; exit 1
          fi
      -
        name: Build and verify ARM64 image before publication
        run: |
          docker buildx build --platform "$DOCKER_TARGET_PLATFORM" \
            --file _docker/build_tydom/Dockerfile \
            --tag "$DOCKER_IMAGE_TAG" --load tydom-bridge
          docker run --rm --network none --platform "$DOCKER_TARGET_PLATFORM" "$DOCKER_IMAGE_TAG" node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('/usr/app/node_modules/tydom-client/package.json', 'utf8')).version;
            require('tydom-client');
            const c = process.env.OPENSSL_CONF;
            console.log('arch=' + process.arch, 'node=' + process.version, 'tydom-client=' + v, 'openssl_conf=' + c);
            if (process.arch !== 'arm64') throw new Error('arch ' + process.arch);
            if (!process.version.startsWith('v26.')) throw new Error('node ' + process.version);
            if (v !== '0.16.1') throw new Error('tydom-client ' + v);
            if (!c || !fs.readFileSync(c, 'utf8').includes('UnsafeLegacyRenegotiation')) throw new Error('OPENSSL_CONF ' + c);
          "
      -
        name: Push verified ARM64 image
        run: |
          docker push "$DOCKER_IMAGE_TAG"
          docker buildx imagetools inspect "$DOCKER_IMAGE_TAG" | tee published-manifest.txt
          echo "### Image ARM64 publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: $DOCKER_IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          grep '^Digest:' published-manifest.txt >> "$GITHUB_STEP_SUMMARY"