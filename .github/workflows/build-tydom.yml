name: Build Tydom Bridge ARM64 Docker Image

on:
  push:
    branches: [ main, master, feat/tydom ]
  pull_request:
    branches: [ main, master, feat/tydom ]
  # Manual run: on master, rebuilds and republishes `latest`; elsewhere, validation only.
  workflow_dispatch:

env:
  DOCKER_TARGET_PLATFORM: linux/arm64
  # Image checks without network: arch, Node, tydom-client version, OpenSSL config required by the Tydom box
  # (legacy renegotiation + weak certificate key, see _docker/build_tydom/README.md).
  IMAGE_CHECK_JS: |
    const fs = require('fs');
    const expected = process.env.EXPECTED_TYDOM_CLIENT;
    const v = JSON.parse(fs.readFileSync('/usr/app/node_modules/tydom-client/package.json', 'utf8')).version;
    require('tydom-client');
    const c = process.env.OPENSSL_CONF;
    console.log('arch=' + process.arch, 'node=' + process.version, 'tydom-client=' + v, 'openssl_conf=' + c);
    if (process.arch !== 'arm64') throw new Error('arch ' + process.arch);
    if (!process.version.startsWith('v26.')) throw new Error('node ' + process.version);
    if (!expected || v !== expected) throw new Error('tydom-client ' + v + ' attendu ' + expected);
    const o = c ? fs.readFileSync(c, 'utf8') : '';
    if (!/^nodejs_conf\s*=/m.test(o) || !o.includes('UnsafeLegacyRenegotiation') || !o.includes('@SECLEVEL=0')) throw new Error('OPENSSL_CONF ' + c);

jobs:
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout the code  
        uses: actions/checkout@v7
      - 
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: tydom-bridge/package-lock.json
      - 
        name: Install dependencies
        working-directory: tydom-bridge
        run: npm ci
      - 
        name: Run unit tests
        working-directory: tydom-bridge
        run: npm test

  scan-sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - 
        name: Checkout the code  
        uses: actions/checkout@v7
      - 
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26' 
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: tydom-bridge
          args: >
            -Dsonar.organization=vzwingma-github
            -Dsonar.projectKey=tydom_bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          sonar.projectKey: tydom_bridge
          sonar.organization: vzwingma-github

  # Build and check without secrets, login or push
  build-tydom:
    name: Build et vérification image ARM64
    runs-on: ubuntu-latest
    needs: [ test ]
    env:
      LOCAL_IMAGE: tydom-bridge:ci
    permissions:
      contents: read
    steps:
      -
        name: Checkout the code
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build ARM64 image (local, no push)
        run: |
          docker buildx build --platform "$DOCKER_TARGET_PLATFORM" \
            --file _docker/build_tydom/Dockerfile \
            --tag "$LOCAL_IMAGE" --load tydom-bridge
      -
        name: Check image (arch, Node, tydom-client, OpenSSL) without network
        run: |
          EXPECTED_TYDOM_CLIENT=$(jq -r '.dependencies["tydom-client"]' tydom-bridge/package.json)
          docker run --rm --network none --platform "$DOCKER_TARGET_PLATFORM" \
            -e EXPECTED_TYDOM_CLIENT="$EXPECTED_TYDOM_CLIENT" "$LOCAL_IMAGE" node -e "$IMAGE_CHECK_JS"

  # Publication of `latest`: master only (push or manual run)
  publish-tydom:
    name: Build and push ARM64 image (latest)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    environment: PROD
    needs: [ build-tydom, scan-sonar ]
    concurrency:
      group: tydom-publication-latest
      cancel-in-progress: false
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKER_IMAGE_TAG: vzwingmadomatic/domoticz-tydom:latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout the code
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Log into registry
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      -
        name: Build and check ARM64 image before publication
        run: |
          docker buildx build --platform "$DOCKER_TARGET_PLATFORM" \
            --file _docker/build_tydom/Dockerfile \
            --tag "$DOCKER_IMAGE_TAG" --load tydom-bridge
          EXPECTED_TYDOM_CLIENT=$(jq -r '.dependencies["tydom-client"]' tydom-bridge/package.json)
          docker run --rm --network none --platform "$DOCKER_TARGET_PLATFORM" \
            -e EXPECTED_TYDOM_CLIENT="$EXPECTED_TYDOM_CLIENT" "$DOCKER_IMAGE_TAG" node -e "$IMAGE_CHECK_JS"
      -
        name: Push checked ARM64 image
        run: |
          docker push "$DOCKER_IMAGE_TAG"
          docker buildx imagetools inspect "$DOCKER_IMAGE_TAG" | tee published-manifest.txt
          echo "### Image ARM64 publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: $DOCKER_IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          grep '^Digest:' published-manifest.txt >> "$GITHUB_STEP_SUMMARY"